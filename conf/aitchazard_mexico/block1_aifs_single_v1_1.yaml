# Block 1: AIFS Single v1.1 retrospective forecasts initialised from ERA5 (CDS).
# Documentation: docs/block1-aifs.md. Decisions: docs/decisions.md (D1-D7, O1-O5).

paths:
  base: /work/FAC/FGSE/IDYST/tbeucler/default/apereze

environment:
  # The 1.1 checkpoint only loads with these overlay libraries (docs/block1-aifs.md)
  container: /work/FAC/FGSE/IDYST/tbeucler/default/apereze/aifs/aifs_single_v2_era5.sif
  pythonpath: /work/FAC/FGSE/IDYST/tbeucler/default/apereze/aifs/pylibs/aifs11
  overlay_packages: [torch_geometric==2.4.0, anemoi-models==0.5.0, anemoi-inference==0.6.3]
  apptainer_module: apptainer/1.4.1
  env:
    ANEMOI_INFERENCE_NUM_CHUNKS: "16"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

model:
  name: aifs-single-1.1
  huggingface_repo: ecmwf/aifs-single-1.1
  # Downloaded once on the login node (scripts/block1/bench_preflight.py); never inside a job
  checkpoint_path: /work/FAC/FGSE/IDYST/tbeucler/default/apereze/aifs/checkpoints/aifs-single-mse-1.1.ckpt
  device: cuda

initial_conditions:
  source: era5-cds
  grid: [0.25, 0.25]
  # Monthly GRIB layout: {root}/{YYYY}/{MM}/{sfc,pl,soil}.grib
  root: /work/FAC/FGSE/IDYST/tbeucler/default/apereze/data/era5
  pressure_levels: [1000, 925, 850, 700, 600, 500, 400, 300, 250, 200, 150, 100, 50]
  soil_levels: [1, 2]
  lag_hours: 6            # AIFS needs t-6 h and t0
  keep_grib_after_task: true   # open decision O5 (4.4 TB if kept)

schedule:
  years: [2000, 2025]     # inclusive
  months: [5, 11]         # inclusive (May-November)
  init_frequency_hours: 6 # 00, 06, 12, 18 UTC
  lead_time_hours: 72     # total horizon passed to runner.run(lead_time=...)
  output_step_hours: 6    # model step, fixed by the checkpoint

regrid:
  # Batched earthkit-regrid matrices restricted to the bounding box of the domains
  method: linear
  module: aitchazard.block1.regrid

output:
  root: /work/FAC/FGSE/IDYST/tbeucler/default/apereze/outputs/block1
  layout: split               # open decision O2: split (0.51 TB) | single (0.65 TB)
  target_grid: [0.25, 0.25]   # N320 -> regular lat-lon before cropping
  dtype: float32
  compression: {zlib: true, complevel: 4}
  per_step: [tp, cp]          # 6 h per step (verified 2026-11-08); NaN at t0
  t0_source: era5             # runner.run does not yield t0
  domains:
    # SwAIther-Precip inputs (11 channels)
    regional:
      lat: [5.0, 35.0]
      lon: [230.0, 300.0]     # 0-360 convention
      variables: [tp, cp, tcc, 10u, 10v, q_500, q_850, t_500, t_850, z_500, z_850]
    # TempestExtremes inputs (fields of Gomez et al. 2026, TCBench); buffer for 6.5 deg contours
    tempest:
      lat: [-5.0, 45.0]
      lon: [220.0, 310.0]     # open decision O3: eastern edge 310 or 330
      variables: [msl, 10u, 10v, z_300, z_500]
  static:
    # Written once per domain: zs = z_sfc / g (m), lsm (0-1)
    variables: [zs, lsm]
  # Open decision O4, must be fixed BEFORE the campaign:
  # optional_variables: [u_200, v_200, u_850, v_850, 100u, 100v]

slurm:
  # Proposed per year-month task (benchmark 2026-11-08: 0.44 h per task)
  account: tbeucler_default
  qos: dcsr
  partition: gpu
  gres: gpu:1
  cpus_per_task: 2
  mem: 16G
  time: "01:00:00"
  array: 0-181
